name: 'Release Astro Editor+'

# Builds the fork's universal macOS app from a `v*-plus.*` tag (for example
# `v1.0.20-plus.1`) and publishes it, with the updater's latest.json, as a
# GitHub release. The version is set from the tag inside the runner, so it is
# never committed.
#
# The app is signed with a self-signed certificate (no Apple Developer ID, no
# notarisation), so people approve it once under System Settings -> Privacy &
# Security -> Open Anyway. See scripts/make-self-signed-cert.sh.
#
# Secrets: MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
#          TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD if the key has one)
# Variables: ASTRO_EDITOR_GITHUB_CLIENT_ID

on:
  push:
    tags: ['v*-plus.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.0.20-plus.1 (created on the selected ref if missing)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-plus\.[0-9]+$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' must look like v1.0.20-plus.1"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vitest and the Tauri CLI still run on Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Runs after the install because it changes package.json
      - name: Set version from tag
        run: bun scripts/release-version.js "$RELEASE_TAG"

      # Self-signed identity: import the .p12 into a throwaway keychain and
      # trust it for code signing, so `codesign` can use it by name
      - name: Import self-signed certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "::error::Set the MACOS_CERT_P12_BASE64 and MACOS_CERT_PASSWORD secrets (scripts/make-self-signed-cert.sh makes them)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          # Trust the (self-signed) certificate for code signing
          security find-certificate -c "Astro Editor+ Self-Signed" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          security add-trusted-cert -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$keychain"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # Self-signed code signing, no notarisation
          APPLE_SIGNING_IDENTITY: 'Astro Editor+ Self-Signed'
          # Updater signature
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the app (see the GitHub publishing code)
          ASTRO_EDITOR_GITHUB_CLIENT_ID: ${{ vars.ASTRO_EDITOR_GITHUB_CLIENT_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Astro Editor+ ${{ env.RELEASE_TAG }}'
          releaseBody: 'Astro Editor+ ${{ env.RELEASE_TAG }}. On first launch, approve the app under System Settings, Privacy & Security, Open Anyway.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
