name: 'Release Astro Editor+'

# Builds the fork's universal macOS app from a `v*-plus.*` tag (for example
# `v1.0.20-plus.1`) and publishes it, with the updater's latest.json, as a
# GitHub release. The version is set from the tag inside the runner, so it is
# never committed.
#
# Signing has two paths, chosen by which secrets exist:
#   1. Developer ID: when APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD are
#      set, the app is signed with that Developer ID Application certificate
#      and notarised (Apple ID or App Store Connect API key, see below).
#   2. Self-signed: otherwise it is signed with a self-signed certificate (no
#      notarisation), and people approve it once under System Settings ->
#      Privacy & Security -> Open Anyway. See scripts/make-self-signed-cert.sh.
#
# Secrets, Developer ID: APPLE_CERTIFICATE (base64 .p12),
#   APPLE_CERTIFICATE_PASSWORD, optional APPLE_SIGNING_IDENTITY (detected from
#   the keychain if unset); notarisation with either APPLE_ID, APPLE_PASSWORD
#   (app-specific password) and APPLE_TEAM_ID, or APPLE_API_ISSUER,
#   APPLE_API_KEY (key ID) and APPLE_API_KEY_P8_BASE64 (base64 .p8)
# Secrets, self-signed: MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD
# Secrets, always: TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD if the key has one)
# Variables: ASTRO_EDITOR_GITHUB_CLIENT_ID

on:
  push:
    tags: ['v*-plus.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.0.20-plus.1 (created on the selected ref if missing)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-plus\.[0-9]+$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' must look like v1.0.20-plus.1"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vitest and the Tauri CLI still run on Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Runs after the install because it changes package.json
      - name: Set version from tag
        run: bun scripts/release-version.js "$RELEASE_TAG"

      - name: Choose signing path
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Signing path: Developer ID (APPLE_CERTIFICATE secrets are set)"
          else
            echo "mode=self-signed" >> "$GITHUB_OUTPUT"
            echo "Signing path: self-signed (no APPLE_CERTIFICATE secrets), no notarisation"
          fi

      # Developer ID: import the .p12 into a throwaway keychain and find the
      # identity. Apple-issued certificates need no manual trust step.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            identity="$APPLE_SIGNING_IDENTITY_SECRET"
            echo "Identity: taken from the APPLE_SIGNING_IDENTITY secret"
          else
            identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -n 1 | sed -E 's/^[^"]*"([^"]+)".*$/\1/')"
            if [ -z "$identity" ]; then
              echo "::error::No 'Developer ID Application' identity found in APPLE_CERTIFICATE (is it a Developer ID Application certificate with its private key?)"
              exit 1
            fi
            echo "Identity: detected from the keychain"
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Notarisation credentials go to the environment only when complete, as
      # tauri treats a variable that is set but empty as present.
      - name: Configure notarisation
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            mkdir -p "$HOME/private_keys"
            key_path="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
            echo "Notarisation: App Store Connect API key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarisation: Apple ID with app-specific password"
          else
            echo "::warning::Signing with Developer ID but no complete notarisation credentials (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID or APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8_BASE64); the app will be signed but not notarised"
          fi

      # Self-signed identity: import the .p12 into a throwaway keychain and
      # trust it for code signing, so `codesign` can use it by name
      - name: Import self-signed certificate
        if: steps.signing.outputs.mode == 'self-signed'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "::error::Set the APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD secrets (Developer ID), or MACOS_CERT_P12_BASE64 and MACOS_CERT_PASSWORD (self-signed; scripts/make-self-signed-cert.sh makes them)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          # Trust the (self-signed) certificate for code signing. The admin
          # trust domain needs no interactive authorisation, and the runner
          # has passwordless sudo.
          security find-certificate -c "Astro Editor+ Self-Signed" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning
          echo "APPLE_SIGNING_IDENTITY=Astro Editor+ Self-Signed" >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # Code signing identity and any notarisation credentials come from
          # the steps above through GITHUB_ENV
          # Updater signature
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the app (see the GitHub publishing code)
          ASTRO_EDITOR_GITHUB_CLIENT_ID: ${{ vars.ASTRO_EDITOR_GITHUB_CLIENT_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Astro Editor+ ${{ env.RELEASE_TAG }}'
          releaseBody: 'Astro Editor+ ${{ env.RELEASE_TAG }}.${{ steps.signing.outputs.mode == ''self-signed'' && '' On first launch, approve the app under System Settings, Privacy & Security, Open Anyway.'' || '''' }}'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
